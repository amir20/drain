services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    configs:
      - source: postgresql_conf
        target: /docker-entrypoint-initdb.d/01_init.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-drain}
      - TIMESCALEDB_TELEMETRY=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=your_password
      # Referenced as $$POSTGRES_* by the provisioned datasource.
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-drain}
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/timescaledb.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dozzle.yaml
      - source: dashboard_retention
        target: /etc/grafana/dashboards/dozzle-retention.json
      - source: dashboard_usage
        target: /etc/grafana/dashboards/dozzle-usage.json
      - source: dashboard_features
        target: /etc/grafana/dashboards/dozzle-features.json
  scheduler:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  view-refresh:
    image: postgres:18-alpine
    command: tail -f /dev/null
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.refresh.schedule: "@every 1h"
      ofelia.job-exec.refresh.command: psql "postgresql://postgres:password@timescaledb/drain" -c 'REFRESH MATERIALIZED VIEW mv_client_activations'
    depends_on:
      - timescaledb
  beacon:
    image: amir20/drain
    depends_on:
      - timescaledb
volumes:
  postgres_data:
  grafana-storage:

# Swarm configs are immutable, so every config carries a version suffix that the
# deploy workflow sets to the short commit sha. Bumping the file content alone is
# not enough - the name has to change for `docker stack deploy` to pick it up.
# Keep `<key>_<version>` under 64 characters or the daemon rejects the name.
configs:
  postgresql_conf:
    name: postgresql_conf_${CONFIG_VERSION:-dev}
    file: ./init/01_init.sql
  grafana_datasource:
    name: grafana_datasource_${CONFIG_VERSION:-dev}
    file: ./grafana/provisioning/datasources/timescaledb.yaml
  grafana_dashboard_provider:
    name: grafana_dashboard_provider_${CONFIG_VERSION:-dev}
    file: ./grafana/provisioning/dashboards/dozzle.yaml
  dashboard_retention:
    name: dashboard_retention_${CONFIG_VERSION:-dev}
    file: ./grafana/dashboards/dozzle-retention.json
  dashboard_usage:
    name: dashboard_usage_${CONFIG_VERSION:-dev}
    file: ./grafana/dashboards/dozzle-usage.json
  dashboard_features:
    name: dashboard_features_${CONFIG_VERSION:-dev}
    file: ./grafana/dashboards/dozzle-features.json
