services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    # Every policy - compression, retention, the continuous-aggregate refreshes and the
    # hourly analytics refresh registered by migrations/003 - runs in a background worker,
    # and those come out of max_worker_processes along with parallel query workers. The
    # extension allows 16 background workers while max_worker_processes sits at the
    # Postgres default of 8, so most of them can never actually start. TimescaleDB wants
    # max_worker_processes >= max_background_workers + max_parallel_workers + 1.
    command: postgres -c max_worker_processes=32
    # Postgres allocates parallel hash joins and sorts out of /dev/shm, and Docker's 64MB
    # default is not enough for the analytics refresh: it fails with
    # "could not resize shared memory segment" (SQLSTATE 53100).
    shm_size: 1gb
    configs:
      - source: postgresql_conf
        target: /docker-entrypoint-initdb.d/01_init.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-drain}
      - TIMESCALEDB_TELEMETRY=off
      # The password is deliberately absent. Production mounts it as a Docker secret and
      # dev sets it in docker-compose.override.yml, which `docker stack deploy` never
      # reads. Keeping it out of this file is what lets every service treat the value
      # the same way, with nothing for the production overlay to cancel.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  # One-shot. 01_init.sql only runs on an empty volume, so everything added after the
  # first deploy arrives through the migrations embedded in the drain image.
  migrate:
    image: amir20/drain
    command: ["-migrate"]
    depends_on:
      - timescaledb
    deploy:
      # A job, not a service: it runs to completion once per deploy. Swarm ignores
      # depends_on entirely, so the deploy workflow waits on this job rather than relying
      # on start order; the retry budget covers Postgres still coming up.
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
  dashboard:
    image: amir20/drain-dashboard
    depends_on:
      - timescaledb
    environment:
      - NUXT_GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-amir20}
      # No credentials and no database URL here. Production gets them as Docker secrets
      # (docker-compose.prod.yml); dev gets the URL from docker-compose.override.yml and
      # the OAuth pair from ./dashboard/.env. A `${VAR:-}` default in this file would
      # resolve to an empty string, and compose ranks `environment` above `env_file` -
      # so it would silently override .env and surface only as "Empty password" 500s.
  # The hourly analytics refresh has no service of its own: migrations/003_schedule.sql
  # registers it on TimescaleDB's job scheduler, alongside the compression and retention
  # policies it already runs. `SELECT * FROM timescaledb_information.job_stats` is where
  # its runs are reported.
  beacon:
    image: amir20/drain
    depends_on:
      - timescaledb
volumes:
  postgres_data:

# Swarm configs are immutable, so every config carries a version suffix that the
# deploy workflow sets to the short commit sha. Bumping the file content alone is
# not enough - the name has to change for `docker stack deploy` to pick it up.
# Keep `<key>_<version>` under 64 characters or the daemon rejects the name.
configs:
  postgresql_conf:
    name: postgresql_conf_${CONFIG_VERSION:-dev}
    file: ./init/01_init.sql
