services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    # Postgres allocates parallel hash joins and sorts out of /dev/shm, and Docker's 64MB
    # default is not enough for the analytics refresh: it fails with
    # "could not resize shared memory segment" (SQLSTATE 53100).
    shm_size: 1gb
    configs:
      - source: postgresql_conf
        target: /docker-entrypoint-initdb.d/01_init.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-drain}
      - TIMESCALEDB_TELEMETRY=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  # One-shot. 01_init.sql only runs on an empty volume, so everything added after the
  # first deploy arrives through the migrations embedded in the drain image.
  migrate:
    image: amir20/drain
    command: ["-migrate"]
    depends_on:
      - timescaledb
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
  dashboard:
    image: amir20/drain-dashboard
    depends_on:
      - timescaledb
    environment:
      - NUXT_DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@timescaledb:5432/${POSTGRES_DB:-drain}
      - NUXT_GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-amir20}
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - NUXT_SESSION_PASSWORD=${SESSION_PASSWORD:-}
  scheduler:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  view-refresh:
    image: postgres:18-alpine
    command: tail -f /dev/null
    labels:
      ofelia.enabled: "true"
      # Rebuilds the derived analytics tables the dashboard reads. Incremental: it
      # reprocesses a trailing window rather than the whole history.
      ofelia.job-exec.refresh.schedule: "@every 1h"
      ofelia.job-exec.refresh.command: psql "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@timescaledb/${POSTGRES_DB:-drain}" -c 'CALL drain_refresh_analytics()'
    depends_on:
      - timescaledb
  beacon:
    image: amir20/drain
    depends_on:
      - timescaledb
volumes:
  postgres_data:

# Swarm configs are immutable, so every config carries a version suffix that the
# deploy workflow sets to the short commit sha. Bumping the file content alone is
# not enough - the name has to change for `docker stack deploy` to pick it up.
# Keep `<key>_<version>` under 64 characters or the daemon rejects the name.
configs:
  postgresql_conf:
    name: postgresql_conf_${CONFIG_VERSION:-dev}
    file: ./init/01_init.sql
