on:
  push:
    tags:
      - "v*"
name: Build & Deploy
jobs:
  build:
    name: Push branches and PRs
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork && !github.event.pull_request.head.repo.fork && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'amir20/drain') }}
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: amir20/drain
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          build-args: TAG=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not type=gha. Actions cache is scoped by ref, and this
          # workflow only ever runs on `push: tags`, so each run writes under its own tag
          # and nothing can read it back - every build started cold (0 CACHED layers on
          # v1.1.4). A cache image is shared across tags.
          cache-from: type=registry,ref=amir20/drain:buildcache
          cache-to: type=registry,ref=amir20/drain:buildcache,mode=max
  dashboard:
    name: Build the analytics dashboard
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork && !github.event.pull_request.head.repo.fork && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'amir20/drain') }}
    steps:
      - uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: amir20/drain-dashboard
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./dashboard
          push: true
          # The dashboard only ever runs on the beacon host.
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not type=gha. Actions cache is scoped by ref, and this
          # workflow only ever runs on `push: tags`, so each run writes under its own tag
          # and nothing can read it back - every build started cold (0 CACHED layers on
          # v1.1.4). A cache image is shared across tags.
          cache-from: type=registry,ref=amir20/drain-dashboard:buildcache
          cache-to: type=registry,ref=amir20/drain-dashboard:buildcache,mode=max
  deploy:
    needs: [build, dashboard]
    runs-on: ubuntu-latest
    name: Deploy to server
    steps:
      - uses: actions/checkout@v7
      - uses: arwynfr/actions-docker-context@v2
        with:
          docker_host: ssh://root@b.dozzle.dev
          context_name: "beacon"
          ssh_cert: ${{ secrets.SSH_CERT }}
          ssh_key: ${{ secrets.SSH_KEY }}
      # Swarm config names are capped at 64 characters, so use a short SHA.
      # DASHBOARD_ALLOWED_USERS, not GITHUB_ALLOWED_USERS: Actions reserves the GITHUB_
      # prefix, so a variable by that name cannot be created and `vars.GITHUB_*` always
      # expands to empty - which compose's `:-` default would silently paper over.
      # No credential passes through here. The database password, OAuth client secret and
      # session password are Docker secrets created once on the host (README, "Deploying"),
      # and this step only names them - so the same command deploys by hand, and a
      # compromise of this workflow does not hand over the credentials themselves.
      # --prune removes services that are in the stack but no longer in these files.
      # Without it `stack deploy` only ever creates and updates, so deleting a service
      # from compose leaves it running on the node, described by nothing in the repo -
      # which is how the ofelia scheduler kept its Docker socket after being removed.
      - run: |
          export CONFIG_VERSION="${GITHUB_SHA::12}"
          docker --context beacon stack deploy --prune -c docker-compose.yml -c docker-compose.prod.yml data
        env:
          GITHUB_ALLOWED_USERS: ${{ vars.DASHBOARD_ALLOWED_USERS }}
          # Public identifier, not a credential: it ships in the redirect URL on every
          # sign-in. A variable rather than a secret so a by-hand deploy can read it back.
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
      # Swarm ignores depends_on, so `migrate` starts alongside the dashboard rather than
      # before it. Waiting on the job here is what turns a failed migration into a failed
      # deploy instead of a dashboard quietly serving 500s.
      #
      # Only a task from the job's current iteration counts. `service ps` still lists the
      # previous deploy's completed task, so "some task is Complete" would pass before
      # this deploy's migration had run. Filtering on desired-state=shutdown, as this once
      # did, is the opposite mistake: a task that finishes cleanly is desired Complete and
      # only the attempts a retry replaced are Shutdown, so a clean run was never seen
      # and every good deploy timed out.
      - name: Wait for migrations
        run: |
          inspect() { docker --context beacon inspect "$1" --format '{{.JobIteration.Index}} {{.Status.State}}'; }
          for i in $(seq 1 60); do
            want=$(docker --context beacon service inspect data_migrate --format '{{.JobStatus.JobIteration.Index}}')
            newest=$(docker --context beacon service ps data_migrate -q | head -1)
            if [ -n "$newest" ]; then
              set -- $(inspect "$newest")
              if [ "$1" = "$want" ]; then
                case "$2" in
                  complete) echo "migrations applied"; exit 0 ;;
                  rejected)
                    docker --context beacon service logs --tail 50 data_migrate
                    echo "migration task rejected"; exit 1 ;;
                esac
                # The retry budget is max_attempts: 10 in docker-compose.yml. More failed
                # attempts than that in this iteration means it has been exhausted.
                failed=0
                for t in $(docker --context beacon service ps data_migrate -q); do
                  case "$(inspect "$t")" in "$want failed") failed=$((failed + 1)) ;; esac
                done
                if [ "$failed" -gt 10 ]; then
                  docker --context beacon service logs --tail 50 data_migrate
                  echo "migration failed"; exit 1
                fi
              fi
            fi
            sleep 5
          done
          docker --context beacon service logs --tail 50 data_migrate
          echo "timed out waiting for migrations"; exit 1
