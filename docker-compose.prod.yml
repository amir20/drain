services:
  timescaledb:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
  beacon:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.beacon.rule: Host(`b.dozzle.dev`)
        traefik.http.services.beacon.loadbalancer.server.port: 4000
        traefik.http.routers.beacon.entrypoints: websecure
        traefik.http.routers.beacon.tls.certresolver: myresolver
    networks:
      - web
      - default
    volumes:
      - /data/beacon:/data
  migrate:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
  dashboard:
    # Only the OAuth client id stays an environment variable: it is a public identifier
    # that ships in the redirect URL, not a credential, so it is a repository *variable*
    # - readable, unlike a secret, which is what lets a by-hand deploy reproduce it. The three that are credentials
    # arrive as files, which the image's entrypoint expands before Nuxt starts - it also
    # builds NUXT_DATABASE_URL out of the same postgres_password secret the database
    # uses, so the password exists in exactly one place.
    environment:
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:?}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET_FILE=/run/secrets/oauth_github_client_secret
      - NUXT_SESSION_PASSWORD_FILE=/run/secrets/session_password
    secrets:
      - postgres_password
      - oauth_github_client_secret
      - session_password
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.dashboard.rule: Host(`dashboard.dozzle.dev`)
        traefik.http.services.dashboard.loadbalancer.server.port: 3000
        traefik.http.routers.dashboard.entrypoints: websecure
        traefik.http.routers.dashboard.tls.certresolver: myresolver
    networks:
      - web
      - default
networks:
  web:
    external: true

# Created once on the host, not shipped by the deploy - so deploying needs no credential
# at hand and does not have to come from CI. `docker stack deploy` only names them.
# See "Deploying" in README.md for the bootstrap commands.
#
# Swarm secrets are immutable and cannot be removed while a service uses them, so the
# version suffix is how they rotate: create `_v2`, change the name here, deploy, then
# remove `_v1`. That makes each rotation an ordinary reviewable commit.
#
# The key on the left is what the container sees - /run/secrets/postgres_password -
# regardless of the external name, so a rotation never touches the application.
secrets:
  postgres_password:
    external: true
    name: drain_postgres_password_v1
  oauth_github_client_secret:
    external: true
    name: drain_oauth_github_client_secret_v1
  session_password:
    external: true
    name: drain_session_password_v1
