services:
  timescaledb:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
  beacon:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.beacon.rule: Host(`b.dozzle.dev`)
        traefik.http.services.beacon.loadbalancer.server.port: 4000
        traefik.http.routers.beacon.entrypoints: websecure
        traefik.http.routers.beacon.tls.certresolver: myresolver
    networks:
      - web
      - default
    volumes:
      - /data/beacon:/data
  migrate:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
  dashboard:
    # Only the OAuth client id stays an environment variable: it is a public identifier
    # that ships in the redirect URL, not a credential. The three that are credentials
    # arrive as files, which the image's entrypoint expands before Nuxt starts - it also
    # builds NUXT_DATABASE_URL out of the same postgres_password secret the database
    # uses, so the password exists in exactly one place.
    environment:
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:?}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET_FILE=/run/secrets/oauth_github_client_secret
      - NUXT_SESSION_PASSWORD_FILE=/run/secrets/session_password
    secrets:
      - postgres_password
      - oauth_github_client_secret
      - session_password
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.dashboard.rule: Host(`dashboard.dozzle.dev`)
        traefik.http.services.dashboard.loadbalancer.server.port: 3000
        traefik.http.routers.dashboard.entrypoints: websecure
        traefik.http.routers.dashboard.tls.certresolver: myresolver
    networks:
      - web
      - default
networks:
  web:
    external: true

# Swarm secrets are immutable, exactly like the configs above, so each one carries the
# same commit-sha suffix: changing only the file's contents leaves the running services
# on the old value. The deploy workflow writes these files from GitHub secrets and they
# never exist in the repository - ./secrets is gitignored.
secrets:
  postgres_password:
    name: postgres_password_${CONFIG_VERSION:-dev}
    file: ./secrets/postgres_password
  oauth_github_client_secret:
    name: oauth_github_client_secret_${CONFIG_VERSION:-dev}
    file: ./secrets/oauth_github_client_secret
  session_password:
    name: session_password_${CONFIG_VERSION:-dev}
    file: ./secrets/session_password
