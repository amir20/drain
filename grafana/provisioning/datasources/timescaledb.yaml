apiVersion: 1

datasources:
  - name: Drain TimescaleDB
    uid: drain-timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: $POSTGRES_USER
    # Left out of isDefault on purpose: this must not steal the default from a
    # datasource that existing dashboards already point at.
    isDefault: false
    editable: true
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
